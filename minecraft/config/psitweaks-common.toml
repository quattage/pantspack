#Psitweaks Common Configuration
[spells]
	#Psitweaks攻撃スペル全体に適用する一律倍率
	#Global multiplier for all Psitweaks offensive spell damage
	# Default: 1.0
	# Range: 0.1 ~ 100.0
	globalSpellPowerMultiplier = 1.0

	#Spell unlock requirements
	[spells.unlocks]
		#特定スペルの利用に解禁を要求するかどうか
		#Whether configured spells require unlock progression in Spell Programmer
		requireSpellUnlocks = true

	#Molecular Divider Settings
	[spells.molecular_divider]
		#分子ディバイダーのダメージ倍率
		#Damage multiplier for Molecular Divider
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

	#Phonon Maser Settings
	[spells.phonon_maser]
		#フォノンメーザーのダメージ倍率
		#Damage multiplier for Phonon Maser
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

	#Aqua Cutter Settings
	[spells.aqua_cutter]
		#アクアカッターのダメージ倍率
		#Damage multiplier for Aqua Cutter
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

	#Dry Meteor Settings
	[spells.dry_meteor]
		#ドライミーティアのダメージ倍率
		#Damage multiplier for Dry Meteor
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

	#Blaze Ball Settings
	[spells.blaze_ball]
		#ブレイズボールのダメージ倍率
		#Damage multiplier for Blaze Ball
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

	#Active Air Mine Settings
	[spells.active_air_mine]
		#作動式: 能動空中機雷 のダメージ倍率
		#Damage multiplier for Trick: Active Air Mine
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

	#Flare Circle Settings
	[spells.flare_circle]
		#作動式: フレアサークル の威力倍率（与ダメージ倍率）
		#Power (damage) multiplier for Trick: Flare Circle
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

	#Ice Circle Settings
	[spells.ice_circle]
		#作動式: アイスサークル の威力倍率（与ダメージ倍率）
		#Power (damage) multiplier for Trick: Ice Circle
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

	#Radiation Injection Settings
	[spells.radiation_injection]
		#作動式: 放射線注入 の被ばく量倍率
		#Radiation amount multiplier for Trick: Radiation Injection
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		radiationMultiplier = 1.0

	#Guillotine Settings
	[spells.guillotine]
		#作動式: ギロチン のダメージ倍率
		#Damage multiplier for Trick: Guillotine
		# Default: 1.0
		# Range: 0.1 ~ 100.0
		damageMultiplier = 1.0

#Item Settings
[items]

	#Gravstringer Settings
	[items.gravstringer]
		#グラヴストリンガーが矢に設定する基礎ダメージ
		#Base damage assigned to arrows fired by the Gravstringer
		# Default: 12.0
		# Range: 0.0 ~ 2.147483647E9
		baseDamage = 12.0

	#Tunneler Settings
	[items.tunneler]
		#トンネラーの最低ダメージ
		#Minimum damage dealt by the Tunneler
		# Default: 36.0
		# Range: 0.0 ~ 2.147483647E9
		minimumDamage = 36.0

#Psi Behavior Settings
[psi]
	#Whether taking damage should not deduct Psi
	disableDamagePsiDeduction = true
	#Whether Psi consumption should not apply a regeneration cooldown
	disableRegenCooldown = true

#Mekanism Integration Settings
[mekanism]
	#ガス燃焼発電機の内部エネルギー容量オーバーライド（J）
	#-1に設定するとMekanismのデフォルト動作（HydrogenEnergyDensityを基準）を使用します。
	#Gas-Burning Generator internal energy capacity override in Joules.
	#Set to -1 to use Mekanism default behavior (HydrogenEnergyDensity based).
	# Default: 2000000
	# Range: -1 ~ 9223372036854775807
	gasBurningGeneratorEnergyCapacity = 2000000

#Ideaspace Storage Settings
[ideaStorage]
	#イデアストレージに格納できるアイテムの最大種類数
	#Maximum number of distinct item types per player in the Ideaspace Storage
	# Default: 256
	# Range: 1 ~ 100000
	maxItemTypes = 256
	#アイテム1種類あたりの上限(最大スタック数に掛ける係数)
	#Per-type item limit as a multiplier of the item's max stack size
	# Default: 16384
	# Range: > 1
	itemStacksPerType = 16384
	#イデアストレージに格納できる液体の最大種類数
	#Maximum number of distinct fluid types per player in the Ideaspace Storage
	# Default: 64
	# Range: 1 ~ 100000
	maxFluidTypes = 64
	#液体1種類あたりの上限(内部単位: mB、既定値は1,048,576 B)
	#Maximum amount per fluid type in internal mB units (default: 1,048,576 B)
	# Default: 1048576000
	# Range: 1 ~ 9223372036854775807
	maxFluidPerType = 1048576000
	#イデアストレージに格納できるChemicalの最大種類数
	#Maximum number of distinct chemical types per player in the Ideaspace Storage
	# Default: 64
	# Range: 1 ~ 100000
	maxChemicalTypes = 64
	#Chemical 1種類あたりの上限(内部単位、既定値は33,554,432 B)
	#Maximum amount per chemical type in internal units (default: 33,554,432 B)
	# Default: 33554432000
	# Range: 1 ~ 9223372036854775807
	maxChemicalPerType = 33554432000
